# V4.1: correctif sans changement de schema public
media:
  input: media/articles
  output: /media/articles
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: articles_industrie
  label: Articles — Industrie
  type: collection
  path: content/articles/industrie
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - conversation
    - contexte
    - perspective_principale
    - genre_narratif
    - unite_programmation
    - source_document_version
    - statut_editorial
    - publication_date
    primary: title
    sort:
    - publication_date
    - title
    search:
    - title
    - summary
    default:
      sort: publication_date
      order: desc
  fields:
  - &id001
    name: title
    label: Titre
    type: string
    required: true
  - &id002
    name: summary
    label: Chapô
    type: text
    description: Facultatif au stade du premier brouillon ; à compléter avant publication.
  - &id003
    name: body
    label: Article
    type: rich-text
    description: Rédigez ou collez votre article ; vous pourrez revenir compléter les autres informations ultérieurement.
  - &id004
    name: format
    label: Format journalistique
    type: select
    options:
      values:
      - name: entretien
        label: Grand entretien
      - name: recit
        label: Récit / comédie
      - name: chronique
        label: Chronique satirique
      - name: regard-croise
        label: Regard croisé
      - name: analyse-sectorielle
        label: Analyse sectorielle
      - name: decouverte
        label: Article de découverte
  - name: cycle
    label: Cycle
    type: select
    default: industrie
    options:
      values:
      - name: industrie
        label: Industrie & transformation des territoires
  - name: conversation
    label: Conversation — code et intitulé
    type: select
    options:
      values:
      - name: C1
        label: C1 — Quand l’usine grandit plus vite que ses moyens
      - name: C2
        label: C2 — Dépendances industrielles
      - name: C3
        label: C3 — Outil industriel
      - name: C4
        label: C4 — Trajectoire industrielle
      - name: C5
        label: C5 — Besoins et proposition de valeur
      - name: C6
        label: C6 — Marchés et débouchés
      - name: C7
        label: C7 — Implantation industrielle
  - name: contexte
    label: Contexte du cycle
    type: select
    options:
      values:
      - name: CST
        label: Croissance sous tension
      - name: ASC
        label: Adaptation sous contrainte
      - name: RSS
        label: Réinvention sous crise
  - &id005
    name: lecture_principale
    label: Lecture historique (compatibilité — préférer la perspective V6)
    type: select
    options:
      values:
      - name: strategie-gouvernance
        label: Stratégie & gouvernance
      - name: finance-investissement
        label: Finance & investissement
      - name: droit-regulation
        label: Droit & régulation
      - name: operations-organisation
        label: Opérations & organisation
      - name: technologie-innovation
        label: Technologie & innovation
      - name: ressources-humaines-competences
        label: Ressources humaines & compétences
      - name: energie-ressources
        label: Énergie & ressources
      - name: territoires-politiques-publiques
        label: Territoires & politiques publiques
  - &v6perspective
    name: perspective_principale
    label: Perspective principale V6 — obligatoire pour une Scène
    type: select
    description: Une seule Scène par perspective dans une même unité de programmation. Regard croisé : laisser vide.
    options:
      values:
      - name: strategie-gouvernance
        label: Stratégie & gouvernance
      - name: finance-investissement
        label: Finance & investissement
      - name: droit-regulation
        label: Droit & régulation
      - name: operations-organisation
        label: Opérations & organisation
      - name: technologie-innovation
        label: Technologie & innovation
      - name: ressources-humaines-competences
        label: Ressources humaines & compétences
      - name: energie-ressources
        label: Énergie & ressources
      - name: territoires-politiques-publiques
        label: Territoires & politiques publiques
  - &v6genre
    name: genre_narratif
    label: Genre de la Scène V6
    type: select
    description: Laisser vide pour un Regard croisé ; la satire est un ton, pas un genre.
    options:
      values:
      - name: grand-entretien
        label: Grand Entretien
      - name: recit
        label: Récit / comédie
      - name: chronique
        label: Chronique
  - &v6code
    name: code_editorial
    label: Identifiant éditorial stable (ne pas changer)
    type: string
  - &v6unite
    name: unite_programmation
    label: Unité de programmation — code stable
    type: string
  - &v6famille
    name: famille_decisionnelle
    label: Famille décisionnelle (Agriculture)
    type: string
  - &v6version
    name: source_document_version
    label: Version exacte affichée en préproduction
    type: string
  - &v6url
    name: source_document_url
    label: Lien du manuscrit Drive de cette version
    type: string
  - &v6reserve
    name: classification_reserve
    label: Réserves de classement (internes)
    type: text
  - name: tag_1
    label: Tag 1 — libre
    type: string
    description: Notion économique ou décisionnelle, éviter les doublons avec cycle, conversation et lecture.
  - name: tag_2
    label: Tag 2 — libre
    type: string
    description: Facultatif
  - name: tag_3
    label: Tag 3 — libre
    type: string
    description: Facultatif
  - name: tag_4
    label: Tag 4 — libre
    type: string
    description: Facultatif
  - name: tag_5
    label: Tag 5 — libre
    type: string
    description: Facultatif
  - &id006
    name: statut_editorial
    label: Étape éditoriale
    type: select
    options:
      values:
      - name: brouillon
        label: Brouillon
      - name: verification
        label: Vérification / anonymisation
      - name: pret
        label: Prêt pour publication
      - name: prepublication
        label: Consultation en préproduction uniquement
      - name: publie
        label: Publié
    default: brouillon
  - &id007
    name: interview_date
    label: Date de réalisation de l’entretien
    type: date
    default: ''
    options:
      format: yyyy-MM-dd
    description: Facultatif et publiable uniquement si cette précision ne met pas la source en danger.
  - &id008
    name: publication_date
    label: Date de publication (réelle ou programmée)
    type: date
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm
    default: ''
    description: Facultatif au stade brouillon. À compléter pour diffusion ; la date réelle de première publication
      ne doit pas être falsifiée. Programmation automatique à développer.
  - &id009
    name: updated_date
    label: Date de mise à jour substantielle
    type: date
    default: ''
    options:
      format: yyyy-MM-dd
    description: Laisser vide tant que l’article n’a pas été substantiellement actualisé.
  - &id010
    name: published
    label: Autorisation de publication (contrôle final)
    type: boolean
    description: 'Ce seul commutateur ne publie pas l''article : le futur moteur appliquera les règles d''autorisation
      et de date.'
    default: false
  - &id011
    name: hero_image
    label: Image principale (16:9 recommandé, 1600 × 900 px)
    type: image
    description: Privilégier WebP optimisé ou JPEG. Le CMS ne valide pas automatiquement dimensions, cadrage
      et poids.
  - &image_layout
    name: taille_image_liste
    label: Format visuel de l'article dans les listes
    type: select
    default: automatique
    description: Choisissez indépendamment pour chaque article son importance visuelle. Sans image, le titre reste affiché.
    options:
      values:
      - name: automatique
        label: Automatique (mise en page actuelle)
      - name: grande
        label: Grande image (article dominant)
      - name: moyenne
        label: Image moyenne (carte)
      - name: vignette
        label: Vignette (à côté du titre)
      - name: sans
        label: Sans image
  - name: mise_en_avant
    label: Priorité éditoriale dans les listes
    type: select
    default: standard
    options:
      values:
      - name: une
        label: À la une
      - name: secondaire
        label: Sujet mis en avant
      - name: standard
        label: Article standard
  - name: affichage_accueil
    label: Photographie dans la liste d'accueil
    type: select
    default: automatique
    options:
      values:
      - name: automatique
        label: Automatique selon position
      - name: photo
        label: Afficher la photographie
      - name: titre
        label: Titre seul
  - name: affichage_rubrique
    label: Photographie dans les listes de cycle, conversation et lecture
    type: select
    default: automatique
    options:
      values:
      - name: automatique
        label: Automatique selon position
      - name: photo
        label: Afficher la photographie
      - name: titre
        label: Titre seul
  - &id012
    name: source_profile
    label: Profil professionnel anonymisé (données publiables seulement)
    type: object
    description: Uniquement des caractéristiques professionnelles publiables, sans identité réelle ni indice
      de réidentification. Le motif général d’anonymisation relève d’une notice commune affichée par le site.
    fields:
    - name: fonction
      label: Fonction anonymisée
      type: string
    - name: organisation_type
      label: Type d’organisation
      type: select
      options:
        values:
        - PME / ETI
        - Grand groupe
        - Association
        - Collectivité territoriale
        - Établissement public
        - Administration
        - Cabinet d’avocats
        - Cabinet de conseil
        - Prestataire / fournisseur
        - Organisation professionnelle
        - Autre / non précisé
    - name: domaine
      label: Domaine d’activité
      type: string
    - name: responsabilites_perimetre
      label: Responsabilités et périmètre d’expérience
      type: text
      description: Synthèse publiable de la nature des missions, du niveau de responsabilité et du périmètre
        d’expérience ; éviter tout détail réidentifiant.
    - name: role_arbitrage
      label: Position dans l’arbitrage
      type: select
      options:
        values:
        - Décideur
        - Participant à la décision
        - Témoin direct
        - Observateur qualifié
        - Autre / non précisé
    - name: experience
      label: Expérience professionnelle (présentation publiable)
      type: text
  - &id013
    name: source_notice
    label: Présentation journalistique anonymisée (texte facultatif de synthèse)
    type: text
    description: Saisir ici un texte de présentation si nécessaire ; les champs structurés ci-dessus servent
      de base. Aucune identité réelle.
  - &id014
    name: methodology_specific
    label: Vérifications ou précisions méthodologiques propres à cet article (facultatif)
    type: text
    description: La méthode commune sera affichée automatiquement par le futur site. Indiquer ici uniquement
      les vérifications spécifiques réellement effectuées.
  - &id015
    name: seo
    label: Référencement et partage social
    type: object
    fields:
    - name: seo_title
      label: Titre SEO
      type: string
    - name: seo_description
      label: Description SEO
      type: text
    - name: social_image
      label: Image de partage
      type: image
    - name: image_alt
      label: Texte alternatif de l’image principale
      type: text
