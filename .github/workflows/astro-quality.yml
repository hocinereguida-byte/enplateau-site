name: Astro preproduction quality gate
on:
  push:
    branches: [prototype-pages-cms]
    paths:
      - 'content/articles/**'
      - 'media-prototype/**'
      - '.github/workflows/astro-quality.yml'
  pull_request:
    paths:
      - 'content/articles/**'
      - 'media-prototype/**'
      - '.github/workflows/astro-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: media-prototype/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Classification and static build
        run: npm run build
      - name: Assert deployment manifest and article generated
        run: |
          test -s dist/deployment.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist/deployment.json'));if(d.commit!==process.env.GITHUB_SHA)process.exit(1)"
          test -s dist/media/articles/industrie/ind-c1-cst-01-brouillon/index.html
          grep -Fq 'Marc D.' dist/media/articles/industrie/ind-c1-cst-01-brouillon/index.html
      - name: Upload compiled site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: astro-site-${{ github.sha }}
          path: media-prototype/dist/
          retention-days: 7
