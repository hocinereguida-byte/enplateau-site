name: Verify Cloudflare Pages deployment
on:
  push:
    branches: [prototype-pages-cms]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-verification
  cancel-in-progress: true
jobs:
  verify-served-version:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for deployed commit and verify Marc D. V6.5
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://enplateau-site.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          ARTICLE="/media/articles/industrie/ind-c1-cst-01-brouillon/"
          for attempt in $(seq 1 50); do
            manifest=$(curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "${BASE_URL}/deployment.json?check=${EXPECTED_SHA}" || true)
            deployed=$(printf '%s' "$manifest" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "Attempt ${attempt}/50: expected ${EXPECTED_SHA}; served ${deployed:-unknown}"
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              page=$(mktemp)
              if curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' "${BASE_URL}${ARTICLE}?check=${EXPECTED_SHA}" -o "$page"; then
                if grep -Fq 'Marc D.' "$page" && grep -Fq 'Les affaires marchaient' "$page"; then
                  echo "SUCCESS: Cloudflare serves expected commit and Marc D. V6.5"
                  echo "### Cloudflare Pages verified" >> "$GITHUB_STEP_SUMMARY"
                  echo "Commit: \`${EXPECTED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "Article: ${BASE_URL}${ARTICLE}" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "Expected Marc D. V6.5 marker not found in served HTML"
              fi
              rm -f "$page"
            fi
            sleep 20
          done
          echo "::error::Cloudflare Pages did not serve the expected commit and article markers within the verification window"
          exit 1
